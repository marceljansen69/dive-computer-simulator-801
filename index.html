<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dive Computer Simulator</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <section id="profile-panel" class="panel">
    <div class="graph-row">
      <div class="axis-title-y">Depth</div>
      <canvas id="profile-canvas"></canvas>
    </div>
    <div class="axis-title-x">Dive Time in Minutes</div>
  </section>

  <section id="display-panel" class="panel">
    <div class="display-main">
      <div class="display-content">
        <div class="readout" id="depth-readout">
          <div class="label">Depth</div>
          <div class="value" id="depth-value">0.0<span class="unit">m</span></div>
        </div>
        <div class="v-divider"></div>
        <div class="readout" id="ndl-readout">
          <div class="label" id="ndl-label">NDL</div>
          <div class="value" id="ndl-value">--</div>
        </div>

        <div class="h-divider"></div>

        <div id="ascent-bar" title="Ascent rate">
          <div class="ascent-box" data-level="9"></div>
          <div class="ascent-box" data-level="8"></div>
          <div class="ascent-box" data-level="7"></div>
          <div class="ascent-box" data-level="6"></div>
          <div class="ascent-box" data-level="5"></div>
          <div class="ascent-box" data-level="4"></div>
          <div class="ascent-box" data-level="3"></div>
          <div class="ascent-box" data-level="2"></div>
          <div class="ascent-box" data-level="1"></div>
        </div>

        <div class="readout readout-compact" id="dive-time-readout">
          <div class="label">Dive Time</div>
          <div class="value" id="time-value">00:00</div>
        </div>

        <div class="selector" id="gf-selector">
          <div class="label">Gradient</div>
          <div class="value" id="gf-value">45/95</div>
          <div class="icon-row">
            <svg class="icon" id="gf-icon" viewBox="0 0 34 20"></svg>
            <div class="arrow-col">
              <button id="gf-up">&#9650;</button>
              <button id="gf-down">&#9660;</button>
            </div>
          </div>
        </div>

        <div class="selector" id="nitrox-selector">
          <div class="label">Nitrox</div>
          <div class="icon-row">
            <div class="value" id="nitrox-value">21</div>
            <div class="arrow-col">
              <button id="nitrox-up">&#9650;</button>
              <button id="nitrox-down">&#9660;</button>
            </div>
          </div>
        </div>

        <div class="selector" id="altitude-selector">
          <div class="label">Altitude</div>
          <div class="icon-row">
            <svg class="icon" id="altitude-icon" viewBox="0 0 34 20"></svg>
            <div class="arrow-col">
              <button id="altitude-up">&#9650;</button>
              <button id="altitude-down">&#9660;</button>
            </div>
          </div>
          <div class="value" id="altitude-value">0 m</div>
        </div>
      </div>
    </div>

  </section>

  <section id="controls-panel" class="panel">
    <div class="sim-controls">
      <button id="start-btn">Start Simulation</button>
      <div class="speed-control">
        <span class="label">Speed</span>
        <input type="range" id="speed-slider" min="20" max="80" value="20" step="1" />
        <span class="value" id="speed-value">20x</span>
      </div>
      <button id="reset-btn">Reset</button>
    </div>
    <div id="log-box">
      <div id="log-list"></div>
    </div>
  </section>

  <section id="bars-panel" class="panel">
    <div class="label">Compartment Loading</div>
    <div id="bars-wrap">
      <canvas id="bars-canvas"></canvas>
      <div id="bars-labels"></div>
      <div id="bars-axis-legend">&lt;Fast&nbsp;&nbsp;-&nbsp;&nbsp;Tissue compartments&nbsp;&nbsp;-&nbsp;&nbsp;Slow&gt;</div>
    </div>
  </section>

</div>

<script type="module" src="ui.js"></script>
</body>
</html>
